name: Build & Release openHop Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & test
        run: |
          python -m pip install --upgrade pip
          pip install build requests pyserial bleak paho-mqtt
          pip install -e .
          python -m unittest discover -s tests -p "*.py"

      - name: Build Wheel
        run: |
          python -m build --wheel

      - name: Compute SHA-256 Digest
        id: checksum
        run: |
          WHL_FILE=$(ls dist/*.whl | head -n 1)
          SHA256=$(sha256sum "$WHL_FILE" | awk '{print $1}')
          echo "wheel_file=$WHL_FILE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Built wheel: $WHL_FILE"
          echo "SHA-256 Digest: $SHA256"

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhop-meshhub-bot-wheel
          path: dist/*.whl

      - name: Create Release & Upload Asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body: |
            ### openHop Plugin Release: openhop.meshhub-bot
            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            
            Install directly via openHop Repeater Plugin Manager or download the attached wheel.
