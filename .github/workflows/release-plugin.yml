name: Build & Release openHop Plugin

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies & test
        run: |
          python -m pip install --upgrade pip
          pip install build requests pyserial bleak paho-mqtt
          pip install -e .
          python -m unittest discover -s tests -p "*.py"

      - name: Build Wheel
        run: |
          python -m build --wheel

      - name: Compute SHA-256 Digest
        id: checksum
        run: |
          WHL_FILE=$(ls dist/*.whl | head -n 1)
          WHL_BASENAME=$(basename "$WHL_FILE")
          SHA256=$(sha256sum "$WHL_FILE" | awk '{print $1}')
          echo "wheel_file=$WHL_FILE" >> $GITHUB_OUTPUT
          echo "wheel_name=$WHL_BASENAME" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "Built wheel: $WHL_FILE"
          echo "SHA-256 Digest: $SHA256"

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openhop-meshhub-bot-wheel
          path: dist/*.whl

      - name: Publish Rolling Latest Release (on push to main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "MeshHub Bot for openHop (Latest Build)"
          prerelease: false
          make_latest: "true"
          files: dist/*.whl
          body: |
            ### Automated Build: openhop.meshhub-bot
            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            
            #### Easy Install on openHop Repeater:
            ```bash
            openhop-plugin-manager install https://github.com/Dhovin/meshhub-bot-openhop/releases/latest/download/${{ steps.checksum.outputs.wheel_name }}
            ```

      - name: Publish Versioned Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          body: |
            ### openHop Plugin Release: openhop.meshhub-bot (${{ github.ref_name }})
            **SHA-256:** `${{ steps.checksum.outputs.sha256 }}`
            
            #### Easy Install on openHop Repeater:
            ```bash
            openhop-plugin-manager install https://github.com/Dhovin/meshhub-bot-openhop/releases/download/${{ github.ref_name }}/${{ steps.checksum.outputs.wheel_name }}
            ```
