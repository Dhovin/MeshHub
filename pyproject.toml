[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-meshhub-bot"
version = "2.0.1"
description = "MeshHub Bot plugin for openHop Repeater with Virtual Companion integration, Autoresponder, US NWS Weather & Alerts, and Radio Net."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dhovin"}
]
dependencies = [
    "meshcore>=2.2.0",
    "requests>=2.31.0",
    "croniter>=2.0.0",
    "pytz>=2024.1",
]

[project.scripts]
meshhub-bot = "openhop_meshhub_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openhop_meshhub_bot*"]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.meshhub-bot" = [
    "openhop-plugin.json",
    "config.default.json",
]
"share/openhop/plugins/openhop.meshhub-bot/ui" = [
    "ui/index.html",
    "ui/app.js",
    "ui/styles.css",
]
