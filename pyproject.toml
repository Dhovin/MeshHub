[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-meshhub-bot"
version = "1.0.8"
description = "Bot & Community Automation Suite for openHop Repeater (Weather, Nets, MeshWars, Autoresponder)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MeshHub Developers"}
]
dependencies = [
    "meshcore>=2.0.0",
    "requests>=2.28.0",
]

[project.scripts]
openhop-meshhub-bot = "openhop_meshhub_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openhop_meshhub_bot*"]

[tool.setuptools.package-data]
"openhop_meshhub_bot" = [
    "share/openhop/plugins/openhop.meshhub-bot/*",
    "share/openhop/plugins/openhop.meshhub-bot/ui/*"
]

[tool.setuptools.data-files]
"share/openhop/plugins/openhop.meshhub-bot" = [
    "openhop-plugin.json",
    "config.default.json",
    "schema.json"
]
"share/openhop/plugins/openhop.meshhub-bot/ui" = [
    "ui/index.html",
    "ui/app.js",
    "ui/styles.css"
]
