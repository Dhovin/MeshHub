[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhop-meshhub-bot"
version = "1.0.2"
description = "Bot & Community Automation Suite for openHop Repeater (Weather, Nets, MeshWars, Autoresponder)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "MeshHub Developers"}
]
dependencies = [
    "meshcore>=2.0.0",
    "aiohttp>=3.8.0",
    "requests>=2.28.0",
]

[project.scripts]
openhop-meshhub-bot = "openhop_meshhub_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openhop_meshhub_bot*"]

[tool.setuptools.package-data]
"openhop_meshhub_bot" = [
    "share/openhop/plugins/openhop.meshhub-bot/*",
    "share/openhop/plugins/openhop.meshhub-bot/ui/*"
]
